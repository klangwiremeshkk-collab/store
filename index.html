<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>KWM คลังอะไหล่</title>
<meta name="theme-color" content="#1F6E43">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root { --g:#1F6E43; --g2:#E8F3EC; --r:#C00000; --o:#E07B00; --line:#E3E6E8; --mut:#6B7280; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:'Sarabun','Noto Sans Thai',system-ui,sans-serif; background:#F5F7F6; color:#1B1F1D; font-size:16px; }
  header { background:var(--g); color:#fff; padding:12px 16px; font-weight:700; font-size:18px; position:sticky; top:0; z-index:5; }
  header small { font-weight:400; opacity:.8; font-size:13px; margin-left:6px; }
  nav { display:flex; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:46px; z-index:5; }
  nav button { flex:1; border:0; background:none; padding:12px 4px; font:inherit; font-size:15px; color:var(--mut); border-bottom:3px solid transparent; }
  nav button.on { color:var(--g); border-bottom-color:var(--g); font-weight:700; }
  main { padding:12px; max-width:720px; margin:0 auto; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px; }
  .row { display:flex; gap:8px; align-items:center; }
  .btn { border:0; border-radius:10px; padding:12px 14px; font:inherit; font-weight:700; background:var(--g); color:#fff; cursor:pointer; }
  .btn.alt { background:#fff; color:var(--g); border:1.5px solid var(--g); }
  .btn.big { width:100%; padding:15px; font-size:17px; }
  .btn:disabled { opacity:.5; }
  .scan { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .scan label { display:flex; justify-content:center; align-items:center; cursor:pointer; }
  .scan .btn { padding:16px 10px; font-size:17px; }
  #reader { display:none; margin-top:10px; border-radius:10px; overflow:hidden; }
  input, select, textarea { width:100%; font:inherit; padding:10px 12px; border:1px solid #CBD2D6; border-radius:10px; background:#fff; }
  label.f { display:block; font-size:13px; color:var(--mut); margin:10px 0 4px; }
  .sugg div { padding:10px 8px; border-bottom:1px solid var(--line); cursor:pointer; }
  .sugg div:active { background:var(--g2); }
  .code { font-family:ui-monospace,monospace; font-size:13px; color:var(--g); font-weight:700; }
  .mut { color:var(--mut); font-size:13px; }
  .line { border-bottom:1px dashed var(--line); padding:10px 0; }
  .line:last-child { border-bottom:0; }
  .qty { display:flex; align-items:center; gap:6px; }
  .qty button { width:40px; height:40px; border-radius:10px; border:1px solid #CBD2D6; background:#fff; font-size:20px; }
  .qty input { width:70px; text-align:center; }
  .x { border:0; background:none; color:var(--r); font-size:22px; padding:4px 8px; }
  .warn { color:var(--r); font-size:13px; font-weight:700; }
  .pill { display:inline-block; padding:2px 8px; border-radius:99px; font-size:12px; font-weight:700; }
  .s-มีของ { background:var(--g2); color:var(--g); }
  .s-ต้องซื้อ { background:#FCE4D6; color:var(--r); }
  .s-ติดลบ { background:var(--r); color:#fff; }
  .s-ยังไม่นับ { background:#EEF0F2; color:var(--mut); }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .chips button { border:1px solid #CBD2D6; background:#fff; border-radius:99px; padding:6px 12px; font:inherit; font-size:14px; }
  .chips button.on { background:var(--g); color:#fff; border-color:var(--g); }
  .h-IN { color:var(--g); font-weight:700; } .h-OUT { color:var(--o); font-weight:700; } .h-COUNT { color:#2F5597; font-weight:700; }
  .cnt { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .cnt label { font-size:12px; color:var(--mut); display:block; margin-bottom:3px; }
  .cnt input.n { font-size:20px; font-weight:700; text-align:center; }
  .diff { font-weight:700; font-size:14px; margin-top:6px; }
  .d-ok { color:var(--g); } .d-short { color:var(--r); } .d-over { color:var(--o); }
  .sysbox { background:#F5F7F6; border-radius:10px; padding:9px 10px; text-align:center; font-size:20px; font-weight:700; }
  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#1B1F1D; color:#fff; padding:12px 16px; border-radius:10px; max-width:92%; display:none; z-index:20; font-size:15px; }
  #toast.err { background:var(--r); }
  .empty { text-align:center; color:var(--mut); padding:18px 0; }
  .hide { display:none !important; }
  img.th { width:44px; height:44px; object-fit:cover; border-radius:8px; }
</style>
</head>
<body>
<header>KWM คลังอะไหล่ <small id="hdrInfo">กำลังโหลด…</small></header>
<nav>
  <button data-tab="OUT" class="on">📤 เบิกออก</button>
  <button data-tab="IN">📥 รับเข้า</button>
  <button data-tab="COUNT">📋 นับ</button>
  <button data-tab="STOCK">📦 สต๊อก</button>
  <button data-tab="HIST">🕘 ประวัติ</button>
</nav>
<main>
  <!-- เบิกออก / รับเข้า -->
  <section id="paneTxn">
    <div class="card">
      <div class="scan">
        <button class="btn" id="btnScan">🎥 สแกน QR</button>
        <label class="btn alt">📷 ถ่ายรูป QR<input type="file" accept="image/*" capture="environment" id="fileQr" hidden></label>
      </div>
      <div id="reader"></div><div id="readerFile" class="hide"></div>
      <input id="search" placeholder="หรือพิมพ์รหัส / ชื่ออะไหล่" autocomplete="off" style="margin-top:10px">
      <div class="sugg" id="sugg"></div>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between"><b id="cartTitle">รายการเบิก</b><span class="mut" id="cartCount"></span></div>
      <div id="cart"><div class="empty">สแกนหรือค้นหาอะไหล่เพื่อเพิ่มรายการ</div></div>
    </div>

    <div class="card">
      <label class="f" id="whoLabel">ผู้เบิก *</label>
      <input id="who" list="dlPeople" placeholder="เลือกหรือพิมพ์ชื่อ">
      <div id="fOut">
        <label class="f">ใช้กับเครื่อง *</label>
        <input id="machine" list="dlMachines" placeholder="เช่น ทอ3, รีด4/1, ทบ 85-9804">
        <label class="f">วัตถุประสงค์</label>
        <select id="purpose"></select>
        <label class="f">เลขงานซ่อม (ถ้ามี)</label>
        <input id="job" placeholder="เลขที่แจ้งซ่อม">
      </div>
      <div id="fCount" class="hide mut" style="margin-top:8px">นับของจริงบนชั้น แล้วใส่จำนวนที่นับได้ — ระบบจะตั้งยอดคงเหลือใหม่ตามที่นับ และบันทึกส่วนต่างไว้ในแท็บ "นับสต๊อก"</div>
      <div id="fIn" class="hide">
        <label class="f">ผู้ขาย / ร้าน</label>
        <input id="vendor" placeholder="ชื่อร้าน">
        <label class="f">เลขที่ PO / ใบส่งของ</label>
        <input id="doc">
      </div>
      <label class="f">หมายเหตุ</label>
      <input id="note">
    </div>
    <button class="btn big" id="btnSubmit">บันทึกเบิกออก</button>
    <div style="height:30px"></div>
  </section>

  <!-- สต๊อก -->
  <section id="paneStock" class="hide">
    <div class="card">
      <input id="stockQ" placeholder="ค้นหารหัส / ชื่อ / ประเภท / ชั้นวาง" autocomplete="off">
      <div class="chips" id="stockChips">
        <button data-f="" class="on">ทั้งหมด</button>
        <button data-f="ต้องซื้อ">ต้องซื้อ</button>
        <button data-f="ติดลบ">ติดลบ</button>
        <button data-f="ยังไม่นับ">ยังไม่นับ</button>
      </div>
    </div>
    <div class="card" id="stockList"></div>
  </section>

  <!-- ประวัติ -->
  <section id="paneHist" class="hide">
    <div class="row" style="justify-content:flex-end;margin-bottom:8px"><button class="btn alt" id="btnHist">↻ โหลดใหม่</button></div>
    <div class="card" id="histList"><div class="empty">กำลังโหลด…</div></div>
  </section>
</main>

<datalist id="dlPeople"></datalist>
<datalist id="dlMachines"></datalist>
<div id="toast"></div>

<script>
/* ====== ตั้งค่า: วางลิงก์เว็บแอป Apps Script (ลงท้ายด้วย /exec) ระหว่างเครื่องหมาย ' ' ====== */
var API_URL = 'https://script.google.com/macros/s/AKfycbwCwmIPNTwIAqCNDzI8rwHS7oHQOdlnXTPNdKtbp6fph5EOnThejah5IN8kM3uFaVHG9g/exec';
/* ================================================================================= */

function getPin(force) {
  var p = '';
  try { p = localStorage.getItem('kwm_pin') || ''; } catch (e) {}
  if (!p || force) {
    p = window.prompt(force ? 'รหัส PIN ไม่ถูกต้อง — ใส่ใหม่' : 'ใส่รหัส PIN ของระบบอะไหล่') || '';
    try { localStorage.setItem('kwm_pin', p); } catch (e) {}
  }
  return p;
}
function callApi(fn, args, retried) {
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(API_URL)) return Promise.reject(new Error('ยังไม่ได้ใส่ API_URL ในไฟล์ index.html'));
  return fetch(API_URL, {
    method: 'POST', redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fn, args: args, pin: getPin(retried) })
  }).then(function (r) { return r.json(); }).then(function (j) {
    if (j.ok) return j.data;
    if (j.code === 'PIN' && !retried) return callApi(fn, args, true);
    throw new Error(j.error || 'ผิดพลาด');
  }, function (e) {
    throw new Error('เชื่อมต่อไม่ได้ — เช็คอินเทอร์เน็ต หรือการตั้งค่า Deploy (' + e.message + ')');
  });
}
/* จำลอง google.script.run ให้โค้ดเดิมใช้ได้ */
var google = { script: { run: (function mk(ok, fail) {
  var r = {
    withSuccessHandler: function (f) { return mk(f, fail); },
    withFailureHandler: function (f) { return mk(ok, f); }
  };
  ['getInit', 'submitTxn', 'submitCount', 'getHistory'].forEach(function (fn) {
    r[fn] = function () {
      callApi(fn, Array.prototype.slice.call(arguments))
        .then(function (d) { if (ok) ok(d); }, function (e) { if (fail) fail(e); });
    };
  });
  return r;
})(null, null) } };
</script>
<script>
var D = { parts: [], people: [], machines: [], purposes: [] };
var P = {};
var mode = 'OUT';
var carts = { OUT: [], IN: [], COUNT: [] };
var scanner = null, busy = false, stockFilter = '';
var $ = function (id) { return document.getElementById(id); };

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function norm(s) { return String(s || '').toLowerCase().replace(/\s+/g, ''); }
function fmt(n) { return n == null ? '-' : Number(n).toLocaleString('th-TH', { maximumFractionDigits: 2 }); }
function toast(msg, err) {
  var t = $('toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = 'none'; }, err ? 5000 : 3000);
}
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

/* ---------- โหลดข้อมูล ---------- */
function load() {
  google.script.run.withSuccessHandler(function (d) {
    D = d; P = {};
    d.parts.forEach(function (p) { P[p.c] = p; });
    $('dlPeople').innerHTML = d.people.map(function (x) { return '<option value="' + esc(x) + '">'; }).join('');
    $('dlMachines').innerHTML = d.machines.map(function (x) { return '<option value="' + esc(x) + '">'; }).join('');
    $('purpose').innerHTML = d.purposes.map(function (x) { return '<option>' + esc(x) + '</option>'; }).join('');
    $('hdrInfo').textContent = d.parts.length + ' รายการ';
    var w = store('kwm_who'); if (w) $('who').value = w;
    try { var dr = JSON.parse(store('kwm_count') || '[]'); carts.COUNT = dr.filter(function (l) { return P[l.c]; }); } catch (e) {}
    renderStock();
  }).withFailureHandler(function (e) { toast('โหลดข้อมูลไม่สำเร็จ: ' + e.message, true); $('hdrInfo').textContent = 'โหลดไม่สำเร็จ'; }).getInit();
}

/* ---------- แท็บ ---------- */
document.querySelectorAll('nav button').forEach(function (b) {
  b.onclick = function () { setTab(b.dataset.tab); };
});
function setTab(t) {
  document.querySelectorAll('nav button').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === t); });
  var txn = t === 'OUT' || t === 'IN' || t === 'COUNT';
  $('paneTxn').classList.toggle('hide', !txn);
  $('paneStock').classList.toggle('hide', t !== 'STOCK');
  $('paneHist').classList.toggle('hide', t !== 'HIST');
  if (txn) {
    mode = t;
    $('fOut').classList.toggle('hide', t !== 'OUT');
    $('fIn').classList.toggle('hide', t !== 'IN');
    $('fCount').classList.toggle('hide', t !== 'COUNT');
    $('whoLabel').textContent = { OUT: 'ผู้เบิก *', IN: 'ผู้รับเข้า *', COUNT: 'ผู้นับ *' }[t];
    $('cartTitle').textContent = { OUT: 'รายการเบิก', IN: 'รายการรับเข้า', COUNT: 'รายการนับ' }[t];
    $('btnSubmit').textContent = { OUT: 'บันทึกเบิกออก', IN: 'บันทึกรับเข้า', COUNT: 'บันทึกยอดนับ' }[t];
    renderCart();
  } else { stopScan(); }
  if (t === 'HIST') loadHist();
  if (t === 'STOCK') renderStock();
}

/* ---------- สแกน ---------- */
$('btnScan').onclick = function () { scanner ? stopScan() : startScan(); };
function camErr(e) {
  var n = (e && (e.name || e.message || String(e))) || '';
  if (/NotAllowed|Permission|denied/i.test(n)) return 'ยังไม่ได้อนุญาตกล้อง — กดไอคอนหน้าลิงก์ > สิทธิ์ > กล้อง > อนุญาต แล้วรีเฟรช';
  if (/NotFound|Overconstrained/i.test(n)) return 'ไม่พบกล้องในเครื่องนี้';
  if (/NotReadable|in use/i.test(n)) return 'กล้องถูกแอปอื่นใช้อยู่ — ปิดแอปกล้อง/LINE แล้วลองใหม่';
  if (/policy|secure|iframe|not supported|undefined/i.test(n)) return 'เปิดกล้องไม่ได้ — ใช้ปุ่ม "📷 ถ่ายรูป QR" แทน';
  return 'เปิดกล้องไม่ได้ (' + n + ') — ใช้ปุ่ม "📷 ถ่ายรูป QR" แทน';
}
function startScan() {
  if (typeof Html5Qrcode === 'undefined') { toast('โหลดตัวสแกนไม่ได้ — ใช้ปุ่ม "📷 ถ่ายรูป QR" แทน', true); return; }
  $('reader').style.display = 'block';
  scanner = new Html5Qrcode('reader', {
    verbose: false,
    formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
    experimentalFeatures: { useBarCodeDetectorIfSupported: true }
  });
  var box = function (w, h) { var s = Math.floor(Math.min(w, h) * 0.8); return { width: s, height: s }; };
  scanner.start({ facingMode: 'environment' },
    { fps: 15, qrbox: box, aspectRatio: 1.0,
      videoConstraints: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 1280 } } },
    function (txt) { onCode(txt); stopScan(); }, function () {})
    .then(function () { $('btnScan').textContent = '⏹ หยุดสแกน'; })
    .catch(function (e) {
      try { scanner.clear(); } catch (x) {}
      scanner = null; $('reader').style.display = 'none';
      toast(camErr(e), true);
    });
}
function stopScan() {
  var s = scanner; scanner = null;
  $('reader').style.display = 'none'; $('btnScan').textContent = '🎥 สแกน QR';
  if (s) s.stop().then(function () { s.clear(); }).catch(function () {});
}
/* ย่อรูปจากกล้องมือถือ (ภาพใหญ่มากมักอ่านไม่ออก) */
function shrinkImage(file, max) {
  return new Promise(function (res, rej) {
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      var s = Math.min(1, max / Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function (b) { res({ canvas: c, file: new File([b], 'qr.jpg', { type: 'image/jpeg' }) }); }, 'image/jpeg', 0.92);
    };
    img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('เปิดรูปไม่ได้')); };
    img.src = url;
  });
}
function scanImageFile(f) {
  var tryLib = function (file) { return new Html5Qrcode('readerFile', { verbose: false }).scanFile(file, false); };
  return shrinkImage(f, 1000).then(function (r) {
    if ('BarcodeDetector' in window) {
      return new BarcodeDetector({ formats: ['qr_code'] }).detect(r.canvas).then(function (codes) {
        if (codes.length) return codes[0].rawValue;
        return tryLib(r.file);
      }).catch(function () { return tryLib(r.file); });
    }
    return tryLib(r.file);
  }).catch(function () {
    return shrinkImage(f, 1600).then(function (r) { return tryLib(r.file); });
  });
}
$('fileQr').onchange = function (e) {
  var f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  if (typeof Html5Qrcode === 'undefined' && !('BarcodeDetector' in window)) { toast('โหลดตัวอ่าน QR ไม่ได้', true); return; }
  toast('กำลังอ่าน QR…');
  scanImageFile(f).then(onCode)
    .catch(function () { toast('อ่าน QR ในรูปไม่ได้ — ถ่ายให้ QR เต็มกรอบ ชัด ไม่สะท้อนแสง', true); });
};
function onCode(txt) {
  var m = String(txt).toUpperCase().match(/A1\d{4}/);
  var c = m ? m[0] : String(txt).trim().toUpperCase();
  if (!P[c]) { toast('ไม่พบรหัส ' + c + ' ในระบบ', true); return; }
  if (navigator.vibrate) navigator.vibrate(80);
  addToCart(c);
}

/* ---------- ค้นหา ---------- */
$('search').oninput = function () {
  var q = norm(this.value);
  if (q.length < 1) { $('sugg').innerHTML = ''; return; }
  var res = D.parts.filter(function (p) { return norm(p.c).indexOf(q) >= 0 || norm(p.n).indexOf(q) >= 0; }).slice(0, 15);
  $('sugg').innerHTML = res.length ? res.map(function (p) {
    return '<div data-c="' + p.c + '"><span class="code">' + p.c + '</span> ' + esc(p.n) +
      '<div class="mut">คงเหลือ ' + fmt(p.b) + ' ' + esc(p.un) + (p.loc ? ' · ชั้น ' + esc(p.loc) : '') + '</div></div>';
  }).join('') : '<div class="mut">ไม่พบ</div>';
};
$('sugg').onclick = function (e) {
  var d = e.target.closest('[data-c]'); if (!d) return;
  addToCart(d.dataset.c); $('search').value = ''; $('sugg').innerHTML = '';
};

/* ---------- ตะกร้า ---------- */
function addToCart(c) {
  var cart = carts[mode], p = P[c];
  var line = cart.filter(function (l) { return l.c === c; })[0];
  if (mode === 'COUNT') {
    if (line) { cart.splice(cart.indexOf(line), 1); cart.unshift(line); toast('นับรายการนี้อยู่แล้ว — แก้จำนวนได้เลย'); }
    else { cart.unshift({ c: c, n: '', loc: p.loc || '' }); toast('เพิ่ม ' + p.n); }
    saveCount(); renderCart();
    var inp = document.querySelector('#cart input[data-n="0"]');
    if (inp) { inp.focus(); inp.select(); }
    return;
  }
  if (line) line.q += 1; else cart.unshift({ c: c, q: 1, p: p.p || '' });
  renderCart();
  toast('เพิ่ม ' + p.n);
}
function saveCount() { store('kwm_count', JSON.stringify(carts.COUNT)); }
function diffHtml(l) {
  if (l.n === '' || l.n == null) return '<div class="diff mut">ยังไม่ได้ใส่จำนวน</div>';
  var p = P[l.c], d = +(Number(l.n) - (p.b == null ? 0 : p.b)).toFixed(3);
  if (d === 0) return '<div class="diff d-ok">✔ ตรงกับระบบ</div>';
  return '<div class="diff ' + (d < 0 ? 'd-short">▼ ขาด ' + fmt(-d) : 'd-over">▲ เกิน ' + fmt(d)) + ' ' + esc(p.un) + '</div>';
}
function renderCountLine(l, i) {
  var p = P[l.c];
  return '<div class="line"><div class="row" style="justify-content:space-between;align-items:flex-start">' +
    '<div><span class="code">' + p.c + '</span> <b>' + esc(p.n) + '</b><div class="mut">' + esc(p.t) + (p.use ? ' · ' + esc(p.use) : '') + '</div></div>' +
    '<button class="x" data-del="' + i + '">×</button></div>' +
    '<div class="cnt"><div><label>ยอดในระบบ</label><div class="sysbox">' + fmt(p.b == null ? 0 : p.b) + ' <span class="mut" style="font-weight:400">' + esc(p.un) + '</span></div></div>' +
    '<div><label>นับได้จริง *</label><input class="n" type="number" inputmode="decimal" min="0" step="any" data-n="' + i + '" value="' + esc(l.n) + '" placeholder="0"></div></div>' +
    '<div id="df' + i + '">' + diffHtml(l) + '</div>' +
    '<div style="margin-top:8px"><label class="mut" style="font-size:12px">ตำแหน่งชั้นวาง</label><input data-l="' + i + '" value="' + esc(l.loc) + '" placeholder="เช่น A-01"></div></div>';
}
function renderCart() {
  var cart = carts[mode];
  $('cartCount').textContent = cart.length ? cart.length + ' รายการ' : '';
  if (!cart.length) { $('cart').innerHTML = '<div class="empty">สแกนหรือค้นหาอะไหล่เพื่อเพิ่มรายการ</div>'; return; }
  if (mode === 'COUNT') {
    var done = cart.filter(function (l) { return l.n !== '' && l.n != null; }).length;
    $('cartCount').textContent = cart.length + ' รายการ · ใส่จำนวนแล้ว ' + done;
    $('cart').innerHTML = cart.map(renderCountLine).join('');
    return;
  }
  $('cart').innerHTML = cart.map(function (l, i) {
    var p = P[l.c];
    var over = mode === 'OUT' && p.b != null && l.q > p.b;
    return '<div class="line"><div class="row" style="justify-content:space-between;align-items:flex-start">' +
      '<div class="row" style="align-items:flex-start">' + (p.img ? '<img class="th" src="' + esc(p.img) + '">' : '') +
      '<div><span class="code">' + p.c + '</span> <b>' + esc(p.n) + '</b>' +
      '<div class="mut">คงเหลือ ' + fmt(p.b) + ' ' + esc(p.un) + (p.loc ? ' · ชั้น ' + esc(p.loc) : '') + '</div></div></div>' +
      '<button class="x" data-del="' + i + '">×</button></div>' +
      '<div class="row" style="margin-top:8px;justify-content:space-between">' +
      '<div class="qty"><button data-dec="' + i + '">−</button><input type="number" inputmode="decimal" min="0" step="any" data-q="' + i + '" value="' + l.q + '"><button data-inc="' + i + '">+</button><span class="mut">' + esc(p.un) + '</span></div>' +
      (mode === 'IN' ? '<div style="width:130px"><input type="number" inputmode="decimal" step="any" data-p="' + i + '" value="' + l.p + '" placeholder="ราคา/หน่วย"></div>' : '') +
      '</div>' + (over ? '<div class="warn">⚠ เบิกเกินยอดคงเหลือในระบบ</div>' : '') + '</div>';
  }).join('');
}
$('cart').onclick = function (e) {
  var t = e.target, cart = carts[mode], i;
  if (t.dataset.del != null) { cart.splice(+t.dataset.del, 1); if (mode === 'COUNT') saveCount(); renderCart(); }
  else if (t.dataset.inc != null) { i = +t.dataset.inc; cart[i].q = +(Number(cart[i].q) + 1).toFixed(3); renderCart(); }
  else if (t.dataset.dec != null) { i = +t.dataset.dec; if (cart[i].q > 1) { cart[i].q = +(Number(cart[i].q) - 1).toFixed(3); renderCart(); } }
};
$('cart').onchange = function (e) {
  var t = e.target, cart = carts[mode];
  if (t.dataset.q != null) { cart[+t.dataset.q].q = Number(t.value) || 0; renderCart(); }
  if (t.dataset.p != null) { cart[+t.dataset.p].p = t.value; }
  if (t.dataset.l != null) { cart[+t.dataset.l].loc = t.value.trim(); saveCount(); }
};
$('cart').oninput = function (e) {
  var t = e.target;
  if (t.dataset.n != null) {
    var i = +t.dataset.n, l = carts.COUNT[i];
    l.n = t.value === '' ? '' : Number(t.value);
    $('df' + i).innerHTML = diffHtml(l); saveCount();
    var done = carts.COUNT.filter(function (x) { return x.n !== '' && x.n != null; }).length;
    $('cartCount').textContent = carts.COUNT.length + ' รายการ · ใส่จำนวนแล้ว ' + done;
  }
};

/* ---------- บันทึก ---------- */
$('btnSubmit').onclick = function () {
  if (busy) return;
  var cart = carts[mode];
  if (!cart.length) { toast('ยังไม่มีรายการ', true); return; }
  if (mode === 'COUNT') { submitCountUI(cart); return; }
  if (cart.some(function (l) { return !(Number(l.q) > 0); })) { toast('ใส่จำนวนให้ครบทุกรายการ', true); return; }
  var head = { who: $('who').value.trim(), note: $('note').value.trim() };
  if (!head.who) { toast('กรุณาใส่ชื่อ' + (mode === 'OUT' ? 'ผู้เบิก' : 'ผู้รับเข้า'), true); return; }
  if (mode === 'OUT') {
    head.machine = $('machine').value.trim(); head.purpose = $('purpose').value; head.job = $('job').value.trim();
    if (!head.machine) { toast('กรุณาระบุเครื่องที่ใช้', true); return; }
  } else { head.vendor = $('vendor').value.trim(); head.doc = $('doc').value.trim(); }
  busy = true; $('btnSubmit').disabled = true; $('btnSubmit').textContent = 'กำลังบันทึก…';
  var kind = mode;
  google.script.run.withSuccessHandler(function (r) {
    r.items.forEach(function (it) { if (P[it.c]) { P[it.c].b = it.b; P[it.c].s = it.s; P[it.c].p = it.p; } });
    carts[kind] = []; store('kwm_who', head.who);
    $('note').value = ''; $('job').value = ''; $('doc').value = '';
    done(); renderCart(); renderStock();
    toast('✅ บันทึกแล้ว ' + r.id + ' (' + r.items.length + ' รายการ)');
  }).withFailureHandler(function (e) { done(); toast('บันทึกไม่สำเร็จ: ' + e.message, true); })
    .submitTxn(kind, head, cart.map(function (l) { return { c: l.c, q: Number(l.q), p: l.p }; }));
  function done() { busy = false; $('btnSubmit').disabled = false; setTab(mode); }
};

function submitCountUI(cart) {
  var miss = cart.filter(function (l) { return l.n === '' || l.n == null || !(Number(l.n) >= 0); });
  if (miss.length) { toast('ยังไม่ได้ใส่จำนวนนับ ' + miss.length + ' รายการ', true); return; }
  var head = { who: $('who').value.trim(), note: $('note').value.trim() };
  if (!head.who) { toast('กรุณาใส่ชื่อผู้นับ', true); return; }
  busy = true; $('btnSubmit').disabled = true; $('btnSubmit').textContent = 'กำลังบันทึก…';
  google.script.run.withSuccessHandler(function (r) {
    r.items.forEach(function (it) { if (P[it.c]) { P[it.c].b = it.b; P[it.c].s = it.s; P[it.c].loc = it.loc; } });
    carts.COUNT = []; saveCount(); store('kwm_who', head.who); $('note').value = '';
    busy = false; $('btnSubmit').disabled = false; setTab('COUNT'); renderStock();
    toast('✅ บันทึกยอดนับแล้ว ' + r.items.length + ' รายการ · ขาด ' + r.short + ' · เกิน ' + r.over);
  }).withFailureHandler(function (e) {
    busy = false; $('btnSubmit').disabled = false; setTab('COUNT');
    toast('บันทึกไม่สำเร็จ: ' + e.message, true);
  }).submitCount(head, cart.map(function (l) { return { c: l.c, n: Number(l.n), loc: l.loc || '' }; }));
}

/* ---------- สต๊อก ---------- */
$('stockQ').oninput = renderStock;
$('stockChips').onclick = function (e) {
  var b = e.target.closest('button'); if (!b) return;
  stockFilter = b.dataset.f;
  document.querySelectorAll('#stockChips button').forEach(function (x) { x.classList.toggle('on', x === b); });
  renderStock();
};
function renderStock() {
  var q = norm($('stockQ').value);
  var list = D.parts.filter(function (p) {
    return (!stockFilter || p.s === stockFilter) &&
      (!q || (norm(p.c) + norm(p.n) + norm(p.t) + norm(p.loc) + norm(p.use)).indexOf(q) >= 0);
  });
  var shown = list.slice(0, 200);
  $('stockList').innerHTML = (list.length ? '<div class="mut" style="margin-bottom:6px">' + list.length + ' รายการ' + (list.length > 200 ? ' (แสดง 200 แรก — พิมพ์ค้นหาเพื่อกรอง)' : '') + '</div>' : '<div class="empty">ไม่พบรายการ</div>') +
    shown.map(function (p) {
      return '<div class="line"><div class="row" style="justify-content:space-between;align-items:flex-start"><div>' +
        '<span class="code">' + p.c + '</span> <b>' + esc(p.n) + '</b>' +
        '<div class="mut">' + esc(p.t) + (p.loc ? ' · ชั้น ' + esc(p.loc) : '') + (p.use ? ' · ' + esc(p.use) : '') + '</div></div>' +
        '<div style="text-align:right;min-width:92px"><b>' + fmt(p.b) + '</b> <span class="mut">' + esc(p.un) + '</span><br>' +
        (p.s ? '<span class="pill s-' + esc(p.s) + '">' + esc(p.s) + '</span>' : '') + '</div></div>' +
        '<div class="row" style="gap:6px;margin-top:6px"><button class="btn alt" style="padding:6px 10px;font-size:14px" data-add="OUT" data-c="' + p.c + '">+ เบิก</button>' +
        '<button class="btn alt" style="padding:6px 10px;font-size:14px" data-add="IN" data-c="' + p.c + '">+ รับเข้า</button>' +
        '<button class="btn alt" style="padding:6px 10px;font-size:14px" data-add="COUNT" data-c="' + p.c + '">+ นับ</button></div></div>';
    }).join('');
}
$('stockList').onclick = function (e) {
  var b = e.target.closest('[data-add]'); if (!b) return;
  setTab(b.dataset.add); addToCart(b.dataset.c); window.scrollTo(0, 0);
};

/* ---------- ประวัติ ---------- */
$('btnHist').onclick = loadHist;
function loadHist() {
  $('histList').innerHTML = '<div class="empty">กำลังโหลด…</div>';
  google.script.run.withSuccessHandler(function (rows) {
    $('histList').innerHTML = rows.length ? rows.map(function (h) {
      return '<div class="line"><div class="row" style="justify-content:space-between"><span class="h-' + h.k + '">' + ({ IN: '📥 รับเข้า', OUT: '📤 เบิก', COUNT: '📋 นับ' }[h.k]) + '</span><span class="mut">' + esc(h.d) + '</span></div>' +
        '<div><span class="code">' + esc(h.c) + '</span> ' + esc(h.n) + ' — <b>' + fmt(h.q) + '</b> ' + esc(h.un) + '</div>' +
        '<div class="mut">' + esc(h.who) + (h.m ? ' · ' + esc(h.m) : '') + (h.x ? ' · ' + esc(h.x) : '') + ' · ' + esc(h.id) + '</div></div>';
    }).join('') : '<div class="empty">ยังไม่มีรายการ</div>';
  }).withFailureHandler(function (e) { $('histList').innerHTML = '<div class="empty">โหลดไม่สำเร็จ: ' + esc(e.message) + '</div>'; }).getHistory();
}

load();
</script>
</body>
</html>
